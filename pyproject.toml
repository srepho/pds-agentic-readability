[project]
name = "pds-agentic-readability"
version = "0.1.0"
description = "Benchmarking how readable Australian insurance Product Disclosure Statements are, for humans and for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "google-genai>=2.31.0",
    "lxml>=6.1.3",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "textstat>=0.7.13",
]

[project.urls]
Repository = "https://github.com/srepho/pds-agentic-readability"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pds_agents"]
